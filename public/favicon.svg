      <stop offset="0%" stop-color="#24103F"/>
      <stop offset="100%" stop-color="#0D0618"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE566"/>
